#
# TEMPLATE — do not apply with placeholder values.
#
# Create the real secret imperatively (never commit the file with real credentials):
#
#   kubectl -n logging create secret generic audit-collector-db \
#     --from-literal=url='postgres://audituser:PASS@<postgres-host>:5432/auditdb?sslmode=require'
#
# The DATABASE_URL format: postgres://USER:PASS@HOST:PORT/DB?sslmode=require
# For CNPG: use the RW service hostname, e.g.:
#   postgres-cluster-rw.postgres.svc.cluster.local
#
apiVersion: v1
kind: Secret
metadata:
  name: audit-collector-db
  namespace: logging
type: Opaque
stringData:
  url: "CHANGE_ME — postgres://audituser:PASS@postgres-host:5432/auditdb?sslmode=require"
