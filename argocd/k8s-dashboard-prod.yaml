apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-dashboard-prod
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-succeeded.email: lsaid@softnet.co.tz
    notifications.argoproj.io/subscribe.on-sync-failed.email: lsaid@softnet.co.tz
    notifications.argoproj.io/subscribe.on-health-status-change.email: lsaid@softnet.co.tz
    notifications.argoproj.io/subscribe.on-pod-crash-loop.email: lsaid@softnet.co.tz
spec:
  project: default
  source:
    repoURL: http://192.168.15.85/kubernetes-manifest/k8s-dashboard-manifest.git
    targetRevision: prod          # prod branch = production releases (image tag = version e.g. 1.2.0)
    path: k8s                     # same folder — Jenkins pushes only after human approval
  destination:
    # ── SEPARATE PROD CLUSTER ───────────────────────────────────────────────────
    # Register the prod cluster in ArgoCD first:
    #   argocd cluster add <prod-context-name>
    server: https://CHANGE_ME_PROD_CLUSTER_API_IP:6443
    namespace: k8s-dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
