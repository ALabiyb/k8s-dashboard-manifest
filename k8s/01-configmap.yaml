# ── ConfigMap ─────────────────────────────────────────────────────────────
# Mounts config.yaml into the pod. Edit this instead of the Docker image
# when you want to change thresholds or SMTP settings without rebuilding.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-config
  namespace: k8s-dashboard
  labels:
    app: k8s-dashboard
    app.kubernetes.io/part-of: k8s-dashboard
data:
  # Injected into the HTML header — value differs per branch.
  APP_ENV: "Development"

  # Per-environment override for the Keycloak OIDC redirect URL. dev branch
  # uses .dev. hostname; prod uses .prod. Both must be listed in the
  # `k8s-dashboard` Keycloak client's Valid Redirect URIs.
  OIDC_REDIRECT_URL: "https://k8s-dashboard.dev.softnethq.co.tz/auth/callback"

  # Keycloak group whose members get the superadmin role (audit log access).
  # Members of this group can see the full K8s API audit trail. Intentionally
  # separate from admin_group so cluster operators cannot access their own
  # audit trail — only the platform team with this Keycloak group membership can.
  OIDC_SUPERADMIN_GROUP: "k8s-cluster-admins"

  config.yaml: |
    app:
      company_name: "SoftNet Technologies"

    server:
      port: 8080
      poll_interval: 30s

    excluded_namespaces:
      - kube-system
      - kube-public
      - kube-node-lease
      - default

    thresholds:
      healthy: 100
      degraded: 70

    notifications:
      email:
        enabled: true
        smtp_host: "smtp.zoho.com"
        smtp_port: 587
        # smtp_tls: true
        smtp_username: "donotreply@softnet.co.tz"
        # Real password is NOT stored here — it's injected at runtime via the
        # SMTP_PASSWORD env var (see 01-secret.example.yaml + the env entry in
        # 02-deployment.yaml), which config.Load() reads and overrides this
        # placeholder with. Never put the real value in this ConfigMap: it's
        # plaintext, world-readable to anyone with namespace `get configmap`
        # access, and goes straight into git history.
        smtp_password: "overridden-by-SMTP_PASSWORD-env-var"
        from: "donotreply@softnet.co.tz"
        # Display name shown by mail clients as the sender ("SoftNet K8s
        # Dashboard <donotreply@softnet.co.tz>"). Envelope stays a bare
        # address — Zoho rejects envelopes with display names.
        from_display_name: "SoftNet K8s Dashboard"
        to:
          - "lsaid@softnet.co.tz"
        on_state_change_only: true
        # Link the alert body uses in its "View dashboard" CTA. Per-env value.
        dashboard_url: "https://k8s-dashboard.dev.softnethq.co.tz"
        # true → styled HTML body with state-colored badges + button;
        # false → plain text (fallback).
        html_body: true

    # ── Keycloak / OIDC single sign-on ──────────────────────────────────
    # Realm: SoftNet AD (unified with kubectl + Dependency-Track).
    # See Obsidian: "K8s Dashboard OIDC RBAC Migration".
    # Env-var overrides (see 02-deployment.yaml):
    #   client_secret  ← OIDC_CLIENT_SECRET (Secret; required)
    #   issuer_url     ← OIDC_ISSUER_URL   (optional override)
    #   redirect_url   ← OIDC_REDIRECT_URL (per-env override, dev vs prod)
    oidc:
      enabled: true
      issuer_url: "https://keycloak.devops.softnethq.co.tz/realms/SoftNet%20AD"
      client_id: "k8s-dashboard"
      client_secret: ""
      redirect_url: "https://k8s-dashboard.dev.softnethq.co.tz/auth/callback"
      # Keycloak group whose members become dashboard admins. Users in any
      # other k8s-* group become viewers; K8s RBAC enforces per-namespace access.
      admin_group: "k8s-cluster-admins"
      # Stopgap for the internal softnethq-CA. Prefer mounting the CA into
      # the pod (SSL_CERT_FILE env + volumeMount) and flipping this to false.
      tls_skip_verify: true
