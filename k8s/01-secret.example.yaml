# ── Secret (TEMPLATE — do not apply this file as-is) ──────────────────────
#
# This is a *reference* for the shape of the Secret the Deployment expects —
# it is named `*.example.yaml` on purpose so it never gets mistaken for the
# real thing and applied with placeholder values still in it (which would
# just move the "plaintext credential in git" problem from the ConfigMap to
# here — see docs/PRODUCTION_READINESS.md §1.1–1.3 for why that matters).
#
# Create the REAL secret imperatively, with real values, and never commit it:
#
#   kubectl -n k8s-dashboard create secret generic dashboard-secrets \
#     --from-literal=DASHBOARD_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=ADMIN_USER="admin" \
#     --from-literal=ADMIN_PASS="<a strong, unique password>" \
#     --from-literal=VIEWER_USER="viewer" \
#     --from-literal=VIEWER_PASS="<a strong, unique password>" \
#     --from-literal=SMTP_PASSWORD="<the real SMTP app password>"
#
# In a GitOps setup (this repo uses ArgoCD — see k8s/argocd/), don't even do
# that by hand per-cluster: use a tool that keeps the *encrypted* form in git
# and decrypts only inside the cluster, e.g.:
#   - Sealed Secrets (bitnami-labs/sealed-secrets) — encrypt with `kubeseal`,
#     commit the resulting SealedSecret, the controller decrypts it in-cluster
#   - External Secrets Operator — the Secret's real value lives in
#     Vault/AWS Secrets Manager/etc., and is synced into the cluster from there
#
# Either approach means `git log` never contains a real credential, which a
# plain `kubectl create secret` + manual `kubectl apply -f` workflow can't
# guarantee (someone, eventually, will `git add` the file with real values in it).
#
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-secrets
  namespace: k8s-dashboard
  labels:
    app: k8s-dashboard
    app.kubernetes.io/part-of: k8s-dashboard
type: Opaque
stringData:
  DASHBOARD_SECRET: "CHANGE_ME — generate with: openssl rand -hex 32"
  ADMIN_USER: "admin"
  ADMIN_PASS: "CHANGE_ME — strong, unique, not 'admin'"
  VIEWER_USER: "viewer"
  VIEWER_PASS: "CHANGE_ME — strong, unique, not 'viewer'"
  SMTP_PASSWORD: "CHANGE_ME — the real SMTP app password"
