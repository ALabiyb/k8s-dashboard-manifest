# ── ClusterRoleBinding ────────────────────────────────────────────────────
# Binds the ClusterRole to our ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-dashboard-reader
subjects:
  - kind: ServiceAccount
    name: k8s-dashboard
    namespace: k8s-dashboard
roleRef:
  kind: ClusterRole
  name: k8s-dashboard-reader
  apiGroup: rbac.authorization.k8s.io

---
# Grants platform admins (k8s-platform-admins Keycloak group) full
# cluster-admin — matching the dashboard's own superadmin role, which is
# meant to have every capability admins have, plus Audit Log access.
# Group-based (not User) because the OIDC username is rendered with an
# issuer prefix (https://keycloak.../realms/SoftNet%20AD#<user>) while
# --oidc-groups-prefix is empty, so User-kind bindings on bare usernames
# never match but Group-kind bindings on bare group names do.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-platform-admins-cluster-admin
subjects:
  - kind: Group
    name: k8s-platform-admins
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
