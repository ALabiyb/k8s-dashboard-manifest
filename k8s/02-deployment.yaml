# ── Deployment ────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-dashboard
  namespace: k8s-dashboard
  labels:
    app: k8s-dashboard
    app.kubernetes.io/part-of: k8s-dashboard
spec:
  replicas: 1   # only one replica needed — it's a read-only dashboard
  selector:
    matchLabels:
      app: k8s-dashboard
  template:
    metadata:
      labels:
        app: k8s-dashboard
    spec:
      serviceAccountName: k8s-dashboard  # use the SA with read-only RBAC

      containers:
        - name: dashboard
          image: harbor.devops.softnethq.co.tz/k8s_dashboard/k8s-dashboard:8
          ports:
            - containerPort: 8080
          args:
            - "-config=/etc/dashboard/config.yaml"
          env:
            - name: MOCK_MODE
              value: "false"
            # Injected into the HTML header — value comes from the dashboard-config
            # ConfigMap which differs per branch (Development on dev, Production on prod).
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: dashboard-config
                  key: APP_ENV

            # ── Secrets (from `dashboard-secrets` — see 01-secret.example.yaml) ──
            # Each of these is read directly by the app at startup:
            #   DASHBOARD_SECRET          → signs/verifies session cookies (auth.go)
            #   ADMIN_USER / ADMIN_PASS   → admin account credentials
            #   VIEWER_USER / VIEWER_PASS → viewer account credentials
            #   SMTP_PASSWORD             → overrides config.yaml's smtp_password (config.go)
            # None of these have real values in this repo — they live only in
            # the cluster Secret, created out-of-band (see the example file's
            # header comment for the recommended GitOps-safe approach).
            - name: DASHBOARD_SECRET
              valueFrom:
                secretKeyRef:
                  name: dashboard-secrets
                  key: DASHBOARD_SECRET
            - name: ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: dashboard-secrets
                  key: ADMIN_USER
            - name: ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: dashboard-secrets
                  key: ADMIN_PASS
            - name: VIEWER_USER
              valueFrom:
                secretKeyRef:
                  name: dashboard-secrets
                  key: VIEWER_USER
            - name: VIEWER_PASS
              valueFrom:
                secretKeyRef:
                  name: dashboard-secrets
                  key: VIEWER_PASS
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dashboard-secrets
                  key: SMTP_PASSWORD

          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            allowPrivilegeEscalation: false
            privileged: false

          volumeMounts:
            - name: config
              mountPath: /etc/dashboard
              readOnly: true

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"

          # Health check — k8s will restart the pod if /api/summary stops responding
          livenessProbe:
            httpGet:
              path: /api/summary
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30

      volumes:
        - name: config
          configMap:
            name: dashboard-config