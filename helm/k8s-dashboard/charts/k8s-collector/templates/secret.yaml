# TEMPORARY pattern (matches the original raw manifest's own TODO): storing
# a credential in a values file / Helm release is a stopgap. Prefer
# db.create: false + db.existingSecretName pointing at an ExternalSecret
# backed by Vault once that's wired up.
{{- if .Values.db.create }}
apiVersion: v1
kind: Secret
metadata:
  name: audit-collector-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-collector.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ .Values.db.url | quote }}
{{- end }}
