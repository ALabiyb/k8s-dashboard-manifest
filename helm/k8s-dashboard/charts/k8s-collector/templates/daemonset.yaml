# One collector pod per control-plane node. Auto-scales as masters are added
# — no manual changes needed.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: k8s-audit-collector
  namespace: {{ .Release.Namespace }}
  annotations:
    # audit.log is mode 600 root:root on every control-plane node — no alternative to UID 0.
    policy.softnet.io/exempt-root: "audit.log is mode 600 root:root on the host"
  labels:
    app: k8s-audit-collector
    app.kubernetes.io/component: collector
    {{- include "k8s-collector.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      app: k8s-audit-collector
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: k8s-audit-collector
        app.kubernetes.io/name: k8s-audit-collector
        app.kubernetes.io/component: collector
    spec:
      nodeSelector:
        {{- toYaml .Values.nodeSelector | nindent 8 }}
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

      # Runs as root: audit.log is mode 600 root:root on the host. The pod is
      # read-only except for its single hostPath volume.
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "k8s-collector.dbSecretName" . }}
                  key: url
            - name: FILTER_HUMANS_ONLY
              value: {{ .Values.filterHumansOnly | quote }}

          ports:
            - name: healthz
              containerPort: 8080
              protocol: TCP

          volumeMounts:
            - name: audit-log
              mountPath: /var/log/kubernetes/audit
              readOnly: true

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            # Override the image's default non-root USER — audit.log is mode 600 root:root.
            runAsUser: 0
            runAsGroup: 0
            capabilities:
              drop: ["ALL"]

      volumes:
        - name: audit-log
          hostPath:
            path: /var/log/kubernetes/audit
            type: Directory

      terminationGracePeriodSeconds: 15
