# For production, prefer secret.existingSecretName pointing at a Secret
# managed by Vault/External Secrets/sealed-secrets over secret.create: true —
# values passed here land in plain Helm release state.
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: dashboard-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-dashboard.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Pure random tokens: auto-generated on first install and held stable
  # across upgrades if left blank (see the stableSecret helper), so
  # upgrading never silently invalidates sessions/embed links/webhook auth.
  DASHBOARD_SECRET: {{ include "k8s-dashboard.stableSecret" (dict "root" . "value" .Values.secret.dashboardSecret "key" "DASHBOARD_SECRET" "length" 32) | quote }}
  EMBED_TOKEN: {{ include "k8s-dashboard.stableSecret" (dict "root" . "value" .Values.secret.embedToken "key" "EMBED_TOKEN" "length" 24) | quote }}
  AUDIT_WEBHOOK_TOKEN: {{ include "k8s-dashboard.stableSecret" (dict "root" . "value" .Values.secret.auditWebhookToken "key" "AUDIT_WEBHOOK_TOKEN" "length" 24) | quote }}
  # ADMIN_USER/PASS and VIEWER_USER/PASS: left blank by default rather than
  # a hardcoded placeholder like "change-me" - a literal default value here
  # would silently BECOME the real password (and suppress the app's own
  # "default credentials in use" warning, which only fires when these env
  # vars are genuinely unset). Blank lets the app's own safe fallback
  # (admin/admin, viewer/viewer, with a logged warning) do its job instead.
  ADMIN_USER: {{ .Values.secret.adminUser | quote }}
  ADMIN_PASS: {{ .Values.secret.adminPass | quote }}
  VIEWER_USER: {{ .Values.secret.viewerUser | quote }}
  VIEWER_PASS: {{ .Values.secret.viewerPass | quote }}
  SMTP_PASSWORD: {{ .Values.secret.smtpPassword | quote }}
  OIDC_CLIENT_SECRET: {{ .Values.secret.oidcClientSecret | quote }}
{{- end }}
