# NOTE on TLS: an HTTPRoute can't carry TLS config — that's configured on the
# *Gateway* it attaches to (owned by the platform team, not this chart). If
# that Gateway has no HTTPS listener yet, traffic to this hostname is plain
# HTTP end-to-end (login POSTs and the session cookie travel in cleartext).
{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: k8s-dashboard-route
  namespace: {{ .Release.Namespace }}
  labels:
    app: k8s-dashboard
    {{- include "k8s-dashboard.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ .Values.httpRoute.gatewayName }}
      namespace: {{ .Values.httpRoute.gatewayNamespace }}
  hostnames:
    - {{ .Values.httpRoute.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: k8s-dashboard
          port: {{ .Values.service.port }}
{{- end }}
