# Loki — single-binary log aggregation backend for the dashboard Logs page.
# Deployed in the same namespace as the dashboard so it's reachable at
# http://loki.<namespace>.svc.cluster.local:3100 without leaving the cluster
# network (see _helpers.tpl's k8s-dashboard.lokiURL).
{{- if .Values.loki.enabled }}
# ── Loki configuration ───────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-dashboard.labels" . | nindent 4 }}
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
      log_level: warn

    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory:  /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

    limits_config:
      reject_old_samples:         true
      reject_old_samples_max_age: 168h
      retention_period:           {{ .Values.loki.retentionPeriod | quote }}

    compactor:
      working_directory:      /loki/compactor
      compaction_interval:    10m
      retention_enabled:      true
      retention_delete_delay: 2h
      delete_request_store:   filesystem   # required by Loki 3.x when retention_enabled: true

    schema_config:
      configs:
        - from: "2024-01-01"
          store:        tsdb
          object_store: filesystem
          schema:       v13
          index:
            prefix: index_
            period: 24h

---
# ── Persistent volume for log chunks ─────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "k8s-dashboard.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.loki.persistence.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.loki.persistence.size }}

---
# ── Loki Deployment ───────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: {{ .Release.Namespace }}
  labels:
    app: loki
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: log-store
    {{- include "k8s-dashboard.labels" . | nindent 4 }}
spec:
  replicas: 1
  revisionHistoryLimit: 3
  # Recreate, not RollingUpdate: loki-data is a ReadWriteOnce PVC and this
  # Deployment only ever runs 1 replica. RollingUpdate tries to bring up the
  # new pod before the old one releases the volume, so the new pod's
  # compactor hangs waiting for the RWO mount ("failed to init delete store:
  # timeout") and crash-loops. Recreate tears down the old pod first.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app: loki
        app.kubernetes.io/name: loki
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      # No nodeSelector — Loki must land on a worker node where the CSI node
      # plugin for its StorageClass runs; control-plane nodes often have 0 CSI
      # drivers registered for block storage.
      securityContext:
        runAsNonRoot: true
        runAsUser:  10001
        runAsGroup: 10001
        fsGroup:    10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: loki
          image: "{{ .Values.loki.image.repository }}:{{ .Values.loki.image.tag }}"
          imagePullPolicy: IfNotPresent
          args: ["-config.file=/etc/loki/loki.yaml"]
          ports:
            - name: http
              containerPort: 3100
            - name: grpc
              containerPort: 9096
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true
            - name: data
              mountPath: /loki
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: 3100
            initialDelaySeconds: 45
            periodSeconds: 30
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data

---
# ── ClusterIP Service ─────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: {{ .Release.Namespace }}
  labels:
    app: loki
spec:
  selector:
    app: loki
  ports:
    - name: http
      port: 3100
      targetPort: http
{{- end }}
